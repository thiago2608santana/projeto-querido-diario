[project]
name = "projeto-querido-diario"
version = "0.1.0"
description = "Pipeline de documentos do Querido Diário com Neon e Pinecone"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.44.1",
    "docling",
    "httpx",
    "ollama",
    "openai",
    "pinecone",
    "psycopg[binary]",
    "python-dotenv",
    "sentence-transformers",
    "sqlalchemy>=2.1.8",
    "streamlit>=1.37",
    "transformers",
]

[dependency-groups]
dev = [
    "ipykernel",
    "matplotlib",
    "mlxtend",
    "numpy",
    "pandas",
    "plotly",
    "scikit-learn",
    "scipy",
    "seaborn",
    "statsmodels",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ANN", "D"]
# SDKs dinâmicos e linhas SQL/JSON usam Any em fronteiras documentadas.
# D401 pressupõe inglês; as docstrings deste projeto são em português.
ignore = ["ANN401", "D203", "D213", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
files = ["app.py", "querido_diario"]
disallow_untyped_defs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Não percorre modelos e dependências de ML dos SDKs opcionais.
module = ["docling.*", "openai.*", "ollama.*"]
follow_imports = "skip"
